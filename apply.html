<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Apply Now | Unique Future</title><link rel="stylesheet" href="style.css"></head>
<body><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">CANDIDATE APPLICATION</span><h1>Apply for an opportunity.</h1><p>Complete the form below with accurate information.</p></div></section><section class="section"><div class="container form-layout"><form id="candidate-form" class="form-card">
<div class="form-title"><h2>Candidate Details</h2><p>Fields marked * are required.</p></div>
<div class="form-grid"><label>Full Name *<input name="name" required></label><label>Mobile Number *<input name="phone" type="tel" required></label><label>Email Address<input name="email" type="email"></label><label>Position Applied For *<input id="position" name="position" required></label><label>Current Location *<input name="location" required></label><label>Years of Experience<input name="experience" type="number" min="0"></label><label>Nationality<input name="nationality"></label><label>Highest Qualification<input name="qualification"></label><label class="wide">Message / Additional Information<textarea name="message" rows="5"></textarea></label><label class="wide">CV / Resume *<input name="cv" type="file" accept=".pdf,.doc,.docx" required></label></div>
<div class="form-note">This front-end demo validates your application locally. Connect a secure backend/form service before collecting real candidate documents.</div><button class="btn btn-gold" type="submit">Submit Application →</button><div id="form-status" class="form-status"></div></form></div></section></main><div id="site-footer"></div><script src="main.js"></script></body></html>
