<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>For Employers | Unique Future</title><link rel="stylesheet" href="style.css"></head>
<body><div id="site-header"></div><main><section class="page-hero"><div class="container"><span class="eyebrow">FOR EMPLOYERS</span><h1>Hire the people your business needs.</h1><p>Tell us about your workforce requirement and our team can follow up.</p></div></section><section class="section"><div class="container form-layout"><form id="employer-form" class="form-card"><div class="form-title"><h2>Manpower Requirement</h2><p>Share your requirement with our recruitment team.</p></div><div class="form-grid"><label>Company Name *<input name="company" required></label><label>Contact Person *<input name="contact" required></label><label>Email *<input name="email" type="email" required></label><label>Phone / WhatsApp *<input name="phone" required></label><label>Country *<input name="country" required></label><label>Job Category<input name="category"></label><label>Position Required *<input name="position" required></label><label>Number of Workers<input name="workers" type="number" min="1"></label><label class="wide">Requirement Details<textarea name="details" rows="6"></textarea></label></div><button class="btn btn-gold" type="submit">Send Requirement →</button><div id="employer-status" class="form-status"></div></form></div></section></main><div id="site-footer"></div><script src="main.js"></script></body></html>
